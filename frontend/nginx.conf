worker_processes  1;
user              nobody;

events {
  worker_connections  1024;
  multi_accept        off;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  tcp_nopush    on;
  tcp_nodelay   on;
  sendfile      on;

  keepalive_timeout  65;

  map $http_user_agent $loggable {
    default 1;
    "~Blackbox-Exporter" 0;
  }

  access_log /var/log/nginx/access.log combined if=$loggable;

  # Select suffix based on Accept header, ignoring if q=0 or 0.0
  map $http_accept_encoding $enc_suffix {
    default                                            "";
    "~*\bbr\b(?!\s*;\s*q=0(\.0+)?(\s*[,;]|\s*$))"      ".br";
    "~*\bgzip\b(?!\s*;\s*q=0(\.0+)?(\s*[,;]|\s*$))"    ".gz";
  }

  # Fallback to gz if no br file exists
  map $http_accept_encoding $enc_fallback {
    default                                            "";
    "~*\bgzip\b(?!\s*;\s*q=0(\.0+)?(\s*[,;]|\s*$))"    ".gz";
  }

  # Map from resolved URI to encoding header
  map $uri $enc_header {
    default    "";
    "~\.br$"   "br";
    "~\.gz$"   "gzip";
  }

  server {
    listen  80;
    root    /usr/share/nginx/html;
    index   index.html;

    # never cache the service-worker
    location ~* service-worker\.js$ {
      expires -1d;
      try_files $uri =404;
    }

    location ~* \.js$ {
      expires 1y;
      default_type application/javascript;
      add_header Content-Encoding $enc_header;
      add_header Vary Accept-Encoding;
      try_files $uri$enc_suffix $uri$enc_fallback $uri =404;
    }

    location ~* openmrs\.(\w*\.)?css$ {
      expires 1y;
      default_type text/css;
      add_header Content-Encoding $enc_header;
      add_header Vary Accept-Encoding;
      try_files $uri$enc_suffix $uri$enc_fallback $uri =404;
    }

    location ~* \.css$ {
      add_header Cache-Control "no-cache, must-revalidate";
      default_type text/css;
      add_header Content-Encoding $enc_header;
      add_header Vary Accept-Encoding;
      try_files $uri$enc_suffix $uri$enc_fallback $uri =404;
    }

    location ~* \.json$ {
      add_header Cache-Control "no-cache, must-revalidate";
      default_type application/json;
      add_header Content-Encoding $enc_header;
      add_header Vary Accept-Encoding;
      try_files $uri$enc_suffix $uri$enc_fallback $uri =404;
    }

    location ~* \.svg$ {
      add_header Cache-Control "no-cache, must-revalidate";
      default_type image/svg+xml;
      add_header Content-Encoding $enc_header;
      add_header Vary Accept-Encoding;
      try_files $uri$enc_suffix $uri$enc_fallback $uri =404;
    }

    # handle anything with a "." that's not an HTML file
    # assume it's a static file
    location ~* \.(?!html?)[^.]+$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # any other URL should serve the single page
    location / {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files /index.html =404;
    }
  }
 }
