services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    volumes:
      - ./frontend/config-core_demo.json:/usr/share/nginx/html/config-core_demo.json:ro
      - ./frontend/act.png:/usr/share/nginx/html/act.png:ro
    depends_on:
      - backend

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
    restart: "unless-stopped"
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      # The addresshierarchy module only reads addressConfiguration.xml from the top level of
      # configuration/addresshierarchy, but the demo content package unpacks it into a
      # referenceapplication-demo subdirectory. Overlay the distro config so every startup
      # copies the files to where the module expects them.
      - ./distro/configuration/addresshierarchy:/openmrs/distribution/openmrs_config/addresshierarchy:ro
      # RHD migration config (Phase 2). Mounted per-domain rather than mounting the whole
      # configuration/ directory, so the demo content package's own domain folders are left intact.
      - ./distro/configuration/conceptsources:/openmrs/distribution/openmrs_config/conceptsources:ro
      - ./distro/configuration/ampathforms:/openmrs/distribution/openmrs_config/ampathforms/rhd:ro
      - ./distro/configuration/programs:/openmrs/distribution/openmrs_config/programs/rhd:ro
      - ./distro/configuration/programworkflows:/openmrs/distribution/openmrs_config/programworkflows/rhd:ro
      - ./distro/configuration/programworkflowstates:/openmrs/distribution/openmrs_config/programworkflowstates/rhd:ro
      - ./distro/configuration/personattributetypes:/openmrs/distribution/openmrs_config/personattributetypes/rhd:ro
      - ./distro/configuration/drugs:/openmrs/distribution/openmrs_config/drugs/rhd:ro
      - ./distro/configuration/concepts:/openmrs/distribution/openmrs_config/concepts/rhd:ro
      - ./distro/configuration/visittypes:/openmrs/distribution/openmrs_config/visittypes:ro
      - ./distro/configuration/patientidentifiertypes:/openmrs/distribution/openmrs_config/patientidentifiertypes:ro
      - ./distro/configuration/locationtags:/openmrs/distribution/openmrs_config/locationtags:ro
      - ./distro/configuration/locationtagmaps:/openmrs/distribution/openmrs_config/locationtagmaps/rhd:ro
      - ./distro/configuration/encountertypes:/openmrs/distribution/openmrs_config/encountertypes:ro
      - ./distro/configuration/attributetypes:/openmrs/distribution/openmrs_config/attributetypes:ro
      - ./distro/configuration/locations:/openmrs/distribution/openmrs_config/locations:ro
      - ./distro/configuration/idgen:/openmrs/distribution/openmrs_config/idgen:ro
      - ./distro/configuration/autogenerationoptions:/openmrs/distribution/openmrs_config/autogenerationoptions:ro


  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
