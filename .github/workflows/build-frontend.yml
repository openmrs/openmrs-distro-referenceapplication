name: Build Frontend

on:
  push:
    branches: [auditlog]
    paths:
      - '.github/workflows/build-frontend.yml'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: 'Docker image tag (e.g., nightly-auditlog)'
        required: false
        default: 'nightly-auditlog'
      docker_image_tag_version:
        description: 'Docker image version tag (e.g., 3.7.x-auditlog)'
        required: false
        default: '3.7.x-auditlog'
      docker_image_tag_env:
        description: 'Docker image environment tag (e.g., audit)'
        required: false
        default: 'audit'
  workflow_call:
    inputs:
      docker_image_tag:
        required: false
        type: string
        default: 'nightly-auditlog'
      docker_image_tag_version:
        required: false
        type: string
        default: '3.7.x-auditlog'
      docker_image_tag_env:
        required: false
        type: string
        default: 'audit'
      ref:
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_TOKEN:
        required: true
      MAVEN_REPO_USERNAME:
        required: true
      MAVEN_REPO_API_KEY:
        required: true

env:
  IMAGE: openmrs/openmrs-reference-application-3-frontend
  DOCKER_IMAGE_TAG: ${{ inputs.docker_image_tag || 'nightly-auditlog' }}
  DOCKER_IMAGE_TAG_VERSION: ${{ inputs.docker_image_tag_version || '3.7.x-auditlog' }}
  DOCKER_IMAGE_TAG_ENV: ${{ inputs.docker_image_tag_env || 'audit' }}
  DOCKER_IMAGE_PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}--frontend
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and Publish the Frontend Image
    if: github.repository == 'openmrs/openmrs-distro-referenceapplication'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./frontend
          push: true
          platforms: ${{ env.DOCKER_IMAGE_PLATFORMS }}
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          tags: |
            ${{ env.IMAGE }}:${{ env.DOCKER_IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ env.DOCKER_IMAGE_TAG_VERSION }}
            ${{ env.IMAGE }}:${{ env.DOCKER_IMAGE_TAG_ENV }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
