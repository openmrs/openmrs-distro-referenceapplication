name: 'Release: Promote QA to Prod'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to finalize, e.g. 3.7.1'
        required: true
      dry_run:
        description: 'Prepare the final commit but push nothing and build nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: o3-release
  cancel-in-progress: false

env:
  BACKEND_IMAGE: openmrs/openmrs-reference-application-3-backend
  FRONTEND_IMAGE: openmrs/openmrs-reference-application-3-frontend
  GATEWAY_IMAGE: openmrs/openmrs-reference-application-3-gateway
  CERTBOT_IMAGE: openmrs/openmrs-reference-application-3-certbot
  MONITORING_INIT_IMAGE: openmrs/openmrs-reference-application-3-monitoring-init

jobs:
  promote:
    name: Promote ${{ inputs.release_version }} to prod
    if: github.repository_owner == 'openmrs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          V: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::release_version must look like 3.7.1 (got: $V)"; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check out release branch and locate the QA-approved RC
        id: setup
        env:
          V: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name "openmrs-bot"
          git config user.email "infrastructure@openmrs.org"

          git rev-parse -q --verify "origin/releases/$V" >/dev/null \
            || { echo "::error::branch releases/$V does not exist — run 'Release: Cut QA Release Candidate' first"; exit 1; }
          git checkout "releases/$V"

          LAST_RC=$(git tag -l "$V-rc.*" | sed "s/^$V-rc\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          [ -n "$LAST_RC" ] || { echo "::error::no RC tags found for $V — run 'Release: Cut QA Release Candidate' first"; exit 1; }
          RC_TAG="$V-rc.$LAST_RC"

          POM_VERSION=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text)
          EOF
          )

          # Distinguish a fresh promote from resuming a partially-failed one.
          RESUME=false
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            # Tag already exists: only resumable when it is this branch's
            # finalized head (a previous run failed after the tag push but
            # before the image dispatches).
            if [ "$(git rev-parse "$V^{commit}")" = "$(git rev-parse HEAD)" ] && [ "$POM_VERSION" = "$V" ]; then
              RESUME=true
              echo "Tag $V already exists at the branch head — resuming to re-dispatch the image builds."
            else
              echo "::error::$V is already released (tag exists), or the tag no longer matches the head of releases/$V — nothing to promote"; exit 1
            fi
          elif [ "$(git rev-parse HEAD)" != "$(git rev-parse "$RC_TAG^{commit}")" ]; then
            # A previous promote run may have pushed the final commit but failed
            # before tagging: exactly one commit past the RC, poms already final.
            if [ "$POM_VERSION" = "$V" ] && [ "$(git rev-parse HEAD~1)" = "$(git rev-parse "$RC_TAG^{commit}")" ]; then
              RESUME=true
              echo "Resuming a previous partial promote run — the final commit is already on the branch."
            else
              echo "::error::releases/$V has commits after $RC_TAG — cut a new RC and QA it before promoting"; exit 1
            fi
          fi

          if [ "$RESUME" = "true" ]; then
            # Never trust a finalized-looking commit blindly: if the frontend is
            # not exact-pinned, the rebuilt image would resolve module versions
            # QA never saw (e.g. someone hand-bumped the poms on the branch).
            if grep -qE '"(latest|next)"' frontend/spa-assemble-config.json; then
              echo "::error::the head of releases/$V looks finalized but frontend/spa-assemble-config.json is not exact-pinned. This commit was not produced by this workflow — reset the branch to $RC_TAG and re-run."; exit 1
            fi
          fi

          CORE=$(sed -n 's/^ARG APP_SHELL_VERSION=//p' frontend/Dockerfile | head -1)
          [ -n "$CORE" ] && [ "$CORE" != "next" ] \
            || { echo "::error::APP_SHELL_VERSION is not pinned on releases/$V — cut a new RC passing core_version"; exit 1; }

          {
            echo "rc_tag=$RC_TAG"
            echo "core=$CORE"
            echo "resume=$RESUME"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $RC_TAG -> $V (app shell $CORE, resume=$RESUME)"

      - name: Log in to Docker Hub
        # Authenticated registry access avoids Docker Hub's anonymous rate
        # limits on shared runner IPs; same credentials as the image builds.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Verify the QA images exist on Docker Hub
        env:
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          for repo in "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$GATEWAY_IMAGE" "$CERTBOT_IMAGE" "$MONITORING_INIT_IMAGE"; do
            # '2>&1 >/dev/null' keeps stderr (the real cause) and drops the manifest dump.
            if err=$(docker buildx imagetools inspect "$repo:$RC_TAG" 2>&1 >/dev/null); then
              echo "$repo:$RC_TAG ✔"
            else
              echo "::error::could not verify $repo:$RC_TAG on Docker Hub: ${err:-unknown error}. A 'not found' means the QA builds have not published; an auth or transient (5xx/rate-limit) error just needs a re-run."
              exit 1
            fi
          done

      - name: Set up Java
        if: steps.setup.outputs.resume != 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Pin frontend modules to the exact QA-tested versions
        if: steps.setup.outputs.resume != 'true'
        env:
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          # Resolve the versions manifest from the published Maven artifact, which is the authoritative version
          dest="$RUNNER_TEMP/qa-frontend"
          mvn -N -q org.apache.maven.plugins:maven-dependency-plugin:3.8.1:unpack \
            -Dartifact="org.openmrs:distro-emr-frontend:${RC_TAG}:zip" \
            -DoutputDirectory="$dest"
          MANIFEST=$(find "$dest" -name spa-assemble-config.json -print -quit)
          [ -n "$MANIFEST" ] \
            || { echo "::error::spa-assemble-config.json not found in distro-emr-frontend:${RC_TAG}"; exit 1; }

          MANIFEST="$MANIFEST" python3 - <<'EOF'
          import json, os, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          manifest = json.load(open(os.environ['MANIFEST']))
          resolved = manifest.get('frontendModules') or {}
          core = manifest.get('coreVersion')
          if not core or not resolved:
              fail("the frontend Maven artifact's spa-assemble-config.json lacks "
                   "coreVersion/frontendModules")

          with open('frontend/spa-assemble-config.json') as f:
              cfg = json.load(f)

          missing = [pkg for pkg in cfg['frontendModules'] if pkg not in resolved]
          if missing:
              fail("Modules in spa-assemble-config.json missing from the QA manifest: "
                   + ", ".join(missing))

          for pkg in cfg['frontendModules']:
              cfg['frontendModules'][pkg] = resolved[pkg]

          # coreVersion first for readability; reassign in case cfg already
          # carried one (dict.update would otherwise win with the old value).
          out = {'coreVersion': core}
          out.update(cfg)
          out['coreVersion'] = core

          with open('frontend/spa-assemble-config.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')

          print(f"Pinned {len(cfg['frontendModules'])} modules to their QA-tested versions (app shell {core}).")
          EOF

          # The resolved manifest should carry only concrete versions; a floating
          # dist-tag here would ship bits QA never saw.
          if grep -qE '"(latest|next)"' frontend/spa-assemble-config.json; then
            echo "::error::frontend/spa-assemble-config.json still references latest/next after pinning — the QA manifest was not fully resolved."; exit 1
          fi
          git diff --stat -- frontend/spa-assemble-config.json

      - name: Set project versions
        if: steps.setup.outputs.resume != 'true'
        env:
          NEW: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mvn -q -B org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$NEW" -DgenerateBackupPoms=false -P distro,frontend
          # A silent no-op here would tag $V on RC-versioned poms (the frontend
          # pin always stages a change, so the commit still succeeds).
          for f in pom.xml distro/pom.xml frontend/pom.xml; do
            grep -q "<version>${NEW}</version>" "$f" \
              || { echo "::error::$f is not at $NEW after versions:set"; exit 1; }
          done

      - name: Create release commit and tag
        env:
          V: ${{ inputs.release_version }}
          RESUME: ${{ steps.setup.outputs.resume }}
        run: |
          set -euo pipefail
          if [ "$RESUME" = "true" ]; then
            echo "Using the final commit already on the branch."
          else
            git add -A
            git commit -m "(release) Release $V"
          fi
          if ! git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            git tag "$V"
          fi
          git show --stat HEAD

      - name: 'Dry run: report what would happen'
        if: inputs.dry_run
        env:
          V: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          {
            echo "## :test_tube: Dry run — nothing was pushed or built"
            echo ""
            echo "Would push \`releases/$V\` and tag \`$V\`, then build all images"
            echo "tagged \`$V\` and \`demo\`, and deploy to o3."
            echo ""
            echo "### Final release commit"
            echo '```diff'
            git show HEAD | head -300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release branch and tag
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git push origin "releases/$V"
          git push origin "refs/tags/$V"

      - name: Write summary
        # always() + push succeeded: report even if a later step failed, but a
        # run that failed before pushing must not claim a release.
        if: ${{ always() && !inputs.dry_run && steps.push.outcome == 'success' }}
        env:
          V: ${{ inputs.release_version }}
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          {
            echo "## :tada: Released \`$V\` (from \`$RC_TAG\`)"
            echo ""
            echo "- Tag: \`$V\`"
            echo "- This run builds the \`$V\` and \`demo\` images and deploys them to o3.openmrs.org."
            echo ""
            echo "### Next steps"
            echo "1. Verify the images and the module versions on o3.openmrs.org:"
            echo '```'
            echo "cosign verify openmrs/openmrs-reference-application-3-backend:$V --certificate-identity-regexp 'https://github.com/$GITHUB_REPOSITORY/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo "2. Announce the release in #openmrs3 and on OpenMRS Talk."
          } >> "$GITHUB_STEP_SUMMARY"

  # Non-blocking (see release-qa.yml): flags the release for follow-up but does
  # not gate the o3 deploy. Runs in parallel with build.
  e2e:
    name: Run release E2E on the final release
    needs: promote
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-on-release.yml
    with:
      ref: ${{ inputs.release_version }}

  build:
    needs: promote
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-all.yml
    with:
      ref: ${{ inputs.release_version }}
      docker_image_tag: ${{ inputs.release_version }}
      docker_image_tag_version: ${{ inputs.release_version }}
      docker_image_tag_env: demo
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}

  deploy-o3:
    needs: build
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/deploy-o3.yml
    with:
      reset: false
    secrets: inherit
