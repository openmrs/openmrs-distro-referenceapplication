name: 'Deploy QA to test3'

on:
  workflow_call:
    inputs:
      reset:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      reset:
        description: 'Fully reset the test3 instance (destroys volumes)'
        type: boolean
        default: false
  schedule:
    # 1 AM UTC = 4 AM EAT = 6:30 AM IST on Monday
    - cron: '0 1 * * 1'

permissions: {}

jobs:
  deploy:
    name: Deploy QA images to test3
    # Job-level (not workflow-level) so serialization holds when this workflow
    # is invoked via workflow_call — a called workflow's own top-level
    # concurrency does not attach to the caller's run.
    concurrency:
      group: deploy-test3
      cancel-in-progress: false
    if: github.repository == 'openmrs/openmrs-distro-referenceapplication'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test3
      url: https://test3.openmrs.org/openmrs/spa
    steps:
      - name: Deploy via scoped SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RESET_FLAGS: ${{ (inputs.reset || github.event_name == 'schedule') && ' --destroy-volumes' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is not set — cannot deploy to test3."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 bonga.openmrs.org >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            deploy@bonga.openmrs.org \
            "deploy emr-3-test${RESET_FLAGS} --no-health-check"
