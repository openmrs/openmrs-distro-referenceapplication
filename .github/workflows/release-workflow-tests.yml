name: Release Workflow Tests

# Runs tests/release-workflows/run-suite.sh, which executes the release
# workflows' run blocks against an isolated local clone.

on:
  pull_request:
    paths:
      - '.github/workflows/release-qa.yml'
      - '.github/workflows/release-prod.yml'
      - '.github/workflows/release-workflow-tests.yml'
      - '.github/workflows/build-all.yml'
      - '.github/workflows/build-*.yml'
      - '.github/workflows/deploy-*.yml'
      - '.github/workflows/e2e-on-release.yml'
      - 'tests/release-workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Release workflow state-machine suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history and tags: the suite derives versions from the poms
          # and uses the real 3.7.0 tag as a negative fixture.
          fetch-depth: 0

      # Validates the reusable-workflow wiring (uses: targets, input/secret
      # names, expression contexts) that the run-block suite cannot exercise.
      # shellcheck is disabled: the run-block lint noise is out of scope here.
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:33ffa3f1ad576165ea9c26f726884defdc411fb1fcb9ccc6a117b2f554ba1723 # 1.7.12
        with:
          args: -shellcheck=

      - name: Run the suite
        run: bash tests/release-workflows/run-suite.sh
