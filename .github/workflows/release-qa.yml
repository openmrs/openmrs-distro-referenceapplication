name: 'Release: Cut QA Release Candidate'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version being released, e.g. 3.7.1'
        required: true
      core_version:
        description: 'esm-core (app shell) version to pin, e.g. 10.0.0. Required for the first RC.'
        required: false
        default: ''
      base_ref:
        description: 'Ref to cut the first RC from (ignored when releases/<version> already exists)'
        required: false
        default: 'main'
      dry_run:
        description: 'Prepare the release commit but push nothing and build nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: o3-release
  cancel-in-progress: false

jobs:
  cut-rc:
    name: Cut RC for ${{ inputs.release_version }}
    if: github.repository_owner == 'openmrs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rc_tag: ${{ steps.setup.outputs.rc_tag }}
    steps:
      - name: Validate inputs
        env:
          V: ${{ inputs.release_version }}
          CORE: ${{ inputs.core_version }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::release_version must look like 3.7.1 (got: $V)"; exit 1; }
          [[ -z "$CORE" || "$CORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::core_version must look like 10.0.0 (got: $CORE)"; exit 1; }
          [[ "$BASE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
            || { echo "::error::base_ref must be a branch or tag name (got: $BASE_REF)"; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Determine release mode and RC number
        id: setup
        env:
          V: ${{ inputs.release_version }}
          CORE: ${{ inputs.core_version }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git config user.name "openmrs-bot"
          git config user.email "infrastructure@openmrs.org"

          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "::error::$V is already released (tag exists) — choose a new release_version"; exit 1
          fi

          if git rev-parse -q --verify "origin/releases/$V" >/dev/null; then
            MODE=update
            git checkout "releases/$V"
          else
            MODE=initial
            if [ -z "$CORE" ]; then
              echo "::error::core_version is required when cutting the first RC of a version"; exit 1
            fi
            if git rev-parse -q --verify "origin/$BASE_REF" >/dev/null; then
              git checkout -b "releases/$V" "origin/$BASE_REF"
            elif git rev-parse -q --verify "$BASE_REF^{commit}" >/dev/null; then
              git checkout -b "releases/$V" "$BASE_REF"
            else
              echo "::error::base_ref '$BASE_REF' not found (must be a branch or tag)"; exit 1
            fi
          fi

          LAST_RC=$(git tag -l "$V-rc.*" | sed "s/^$V-rc\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          RC_N=$(( ${LAST_RC:-0} + 1 ))
          RC_TAG="$V-rc.$RC_N"

          OLD_VERSION=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('pom.xml').getroot().find('m:version', ns).text)
          EOF
          )

          {
            echo "mode=$MODE"
            echo "rc_tag=$RC_TAG"
            echo "old_version=$OLD_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE — cutting $RC_TAG (replacing pom version $OLD_VERSION)"

      - name: Pin frontend versions
        env:
          CORE: ${{ inputs.core_version }}
        run: |
          set -euo pipefail
          sed -i 's/"next"/"latest"/g' frontend/spa-assemble-config.json
          # QA previews test released modules; no unreleased "next" dist-tag may remain.
          if grep -q '"next"' frontend/spa-assemble-config.json; then
            echo "::error::frontend/spa-assemble-config.json still references the \"next\" dist-tag after pinning."; exit 1
          fi
          if [ -n "$CORE" ]; then
            sed -i -E "s|^ARG APP_SHELL_VERSION=.*|ARG APP_SHELL_VERSION=${CORE}|" frontend/Dockerfile
            sed -i -E "s|APP_SHELL_VERSION:-[^}]*|APP_SHELL_VERSION:-${CORE}|g" frontend/Dockerfile
            grep -q "^ARG APP_SHELL_VERSION=${CORE}$" frontend/Dockerfile \
              || { echo "::error::failed to pin APP_SHELL_VERSION — check that frontend/Dockerfile still declares the 'ARG APP_SHELL_VERSION=' line"; exit 1; }
          else
            # core_version omitted (later RC): the branch must already carry a
            # concrete pinned app shell (reject empty/next/latest/floating forms).
            PINNED=$(sed -n 's/^ARG APP_SHELL_VERSION=//p' frontend/Dockerfile | head -1)
            if [[ ! "$PINNED" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::APP_SHELL_VERSION on this branch is not a concrete version (got: '${PINNED}') — pass core_version"; exit 1
            fi
            echo "Keeping app shell version already pinned on the branch: $PINNED"
          fi

      - name: Set project versions
        env:
          NEW: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          mvn -q -B org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$NEW" -DgenerateBackupPoms=false -P distro,frontend
          # Guard the empty-diff resume path below: a silent no-op here would let
          # a still-dev-versioned HEAD be tagged as the RC.
          for f in pom.xml distro/pom.xml frontend/pom.xml; do
            grep -q "<version>${NEW}</version>" "$f" \
              || { echo "::error::$f is not at $NEW after versions:set"; exit 1; }
          done
          git diff --stat

      - name: Refuse SNAPSHOT module versions
        # A release must not pin any module to a -SNAPSHOT: those are mutable
        # and would let the shipped bits drift from what QA tested. (Timestamp-
        # locked snapshots are immutable and therefore allowed.)
        run: |
          set -euo pipefail
          if grep -nE -e '-SNAPSHOT<' distro/pom.xml; then
            echo "::error::distro/pom.xml references SNAPSHOT module versions (shown above) — release those modules and pin concrete versions before cutting a release."
            exit 1
          fi

      - name: Create release commit and tag
        env:
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            # A previous run pushed the release commit but failed before tagging
            # or dispatching — resume idempotently from the current HEAD.
            echo "No file changes — resuming a previous partial run; tagging current HEAD."
          else
            git commit -m "(release) Release v${RC_TAG}"
          fi
          git tag "$RC_TAG"
          git show --stat HEAD

      - name: 'Dry run: report what would happen'
        if: inputs.dry_run
        env:
          V: ${{ inputs.release_version }}
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          {
            echo "## :test_tube: Dry run — nothing was pushed or built"
            echo ""
            echo "Would push branch \`releases/$V\` and tag \`$RC_TAG\`, then build all"
            echo "images at \`$RC_TAG\` tagged \`$RC_TAG\` and \`qa\`, and deploy to test3."
            echo ""
            echo "### Release commit"
            echo '```diff'
            git show HEAD | head -300 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push release branch and tag
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ inputs.release_version }}
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
        run: |
          set -euo pipefail
          git push origin "releases/$V"
          git push origin "refs/tags/$RC_TAG"

      - name: Write summary
        # always() + push succeeded: report even if a later step failed, but a
        # run that failed before pushing must not claim an RC was cut.
        if: ${{ always() && !inputs.dry_run && steps.push.outcome == 'success' }}
        env:
          V: ${{ inputs.release_version }}
          RC_TAG: ${{ steps.setup.outputs.rc_tag }}
          MODE: ${{ steps.setup.outputs.mode }}
        run: |
          set -euo pipefail
          {
            echo "## :rocket: Cut \`$RC_TAG\` (${MODE} release)"
            echo ""
            echo "- Branch: [\`releases/$V\`](https://github.com/$GITHUB_REPOSITORY/tree/releases/$V)"
            echo "- Tag: \`$RC_TAG\`"
            echo "- This run builds the \`$RC_TAG\` and \`qa\` images and deploys them to test3.openmrs.org."
            echo ""
            echo "### Next steps"
            echo "1. Run through the [QA checklist](https://om.rs/o3qasheet) on test3."
            echo "2. Fixes needed? Commit them to \`releases/$V\` and re-run this workflow for the next RC."
            echo "3. QA passed? Run the *Release: Promote QA to Prod* workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # E2E and the dev-version bump run as their own jobs (needs: cut-rc) so a
  # failure in either never blocks the RC build/deploy — the RC tag is already
  # pushed by the time these run. Re-run the failed job to retry.
  e2e:
    name: Run release E2E on the RC
    needs: cut-rc
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-on-release.yml
    with:
      ref: ${{ needs.cut-rc.outputs.rc_tag }}

  bump-dev-version:
    name: Open dev-version bump PR on main if needed
    needs: cut-rc
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Open dev-version bump PR on main if needed
        # Idempotent: exits when main is already ahead; updates the existing PR
        # branch otherwise.
        env:
          # Prefer the bot PAT (as check-dependency-updates.yml does) so CI
          # runs on the bump PR — GITHUB_TOKEN-created PRs get no triggers.
          GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN || github.token }}
          V: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name "openmrs-bot"
          git config user.email "infrastructure@openmrs.org"
          git show origin/main:pom.xml > /tmp/main-pom.xml
          MAIN_DEV=$(python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          print(ET.parse('/tmp/main-pom.xml').getroot().find('m:version', ns).text)
          EOF
          )
          BASE="${MAIN_DEV%-SNAPSHOT}"
          if [ "$(printf '%s\n%s\n' "$BASE" "$V" | sort -V | tail -1)" != "$V" ] && [ "$BASE" != "$V" ]; then
            echo "main development version ($MAIN_DEV) is already ahead of $V — no bump needed."
            exit 0
          fi
          NEXT_DEV=$(echo "$V" | awk -F. '{printf "%d.%d.0-SNAPSHOT", $1, $2 + 1}')
          BRANCH="release/bump-dev-after-$V"
          git checkout -B "$BRANCH" origin/main
          mvn -q -B org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$NEXT_DEV" -DgenerateBackupPoms=false -P distro,frontend
          git add -A
          git commit -m "(release-revert) Bump development version to $NEXT_DEV"
          git push -f origin "$BRANCH"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "(release-revert) Bump development version to $NEXT_DEV" \
              --body "Bumps the development version on main to \`$NEXT_DEV\` now that \`$V\` has entered the release process (see the \`releases/$V\` branch). Opened automatically by the *Release: Cut QA Release Candidate* workflow. If CI checks did not start automatically, close and reopen this PR."; then
            # Creation fails when the PR already exists (e.g. a re-run); only
            # fail the step when no open PR is actually there.
            if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number' | grep -q .; then
              echo "Bump PR for $BRANCH is already open — updated the branch only."
            else
              echo "::error::could not open the dev-version bump PR for $BRANCH"; exit 1
            fi
          fi

  build:
    needs: cut-rc
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-all.yml
    with:
      ref: ${{ needs.cut-rc.outputs.rc_tag }}
      docker_image_tag: ${{ needs.cut-rc.outputs.rc_tag }}
      docker_image_tag_version: ${{ needs.cut-rc.outputs.rc_tag }}
      docker_image_tag_env: qa
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}

  deploy-test3:
    needs: build
    if: ${{ !inputs.dry_run }}
    permissions: {}
    uses: ./.github/workflows/deploy-test3.yml
    with:
      reset: false
    secrets: inherit
