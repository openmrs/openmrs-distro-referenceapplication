name: Run E2E Tests on Release Candidate

# Builds the distro from source at a release ref and runs each ESM repo's
# Playwright suite at the module version pinned into that build.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Ref (RC tag / branch / commit) to build and test'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (RC tag / branch / commit) to build and test'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      patient_management_ref: ${{steps.refs.outputs.patient_management}}
      patient_chart_ref: ${{steps.refs.outputs.patient_chart}}
      esm_core_ref: ${{steps.refs.outputs.esm_core}}
      form_builder_ref: ${{steps.refs.outputs.form_builder}}
      cohort_builder_ref: ${{steps.refs.outputs.cohort_builder}}
      dispensing_ref: ${{steps.refs.outputs.dispensing}}
      billing_ref: ${{steps.refs.outputs.billing}}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Build and Run Containers
        run: docker compose -f ./tests/e2e/docker-compose-build.yml up -d

      - name: Wait for the backend to start
        timeout-minutes: 25
        run: while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost/openmrs/login.htm)" != "200" ]]; do sleep 10; done

      # The tree at a release ref pins modules to a floating dist-tag
      # ("latest"/"next"), so the concrete versions to test against only exist
      # in the resolved manifest baked into the built frontend image.
      - name: Resolve pinned module versions from the built frontend image
        id: refs
        run: |
          docker cp frontend:/usr/share/nginx/html/spa-assemble-config.json frontend/spa-assemble-config.json
          bash ./tests/e2e/extract_tag_numbers.sh

      - name: Commit and export Containers
        run: bash ./tests/e2e/commit_and_export_images.sh

      - name: Verify artifact was created
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la .
          if [[ ! -f e2e_release_env_images.tar.gz ]]; then
            echo "ERROR: e2e_release_env_images.tar.gz not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e_release_env_images
          path: e2e_release_env_images.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Capture Server Logs
        if: failure()
        uses: openmrs/openmrs-contrib-gha-workflows/.github/actions/capture-docker-logs@main
        with:
          dest: "./logs"

      - name: Upload Logs as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-logs-build-backend
          path: "./logs"
          overwrite: true

  run-e2e-tests:
    name: E2E tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: patient_management
            repo: openmrs-esm-patient-management
            name: patient-management
          - key: patient_chart
            repo: openmrs-esm-patient-chart
            name: patient-chart
          - key: form_builder
            repo: openmrs-esm-form-builder
            name: form-builder
          - key: esm_core
            repo: openmrs-esm-core
            name: esm-core
          - key: cohort_builder
            repo: openmrs-esm-cohortbuilder-app
            name: cohort-builder
          - key: dispensing
            repo: openmrs-esm-dispensing-app
            name: dispensing-app
          - key: billing
            repo: openmrs-esm-billing-app
            name: billing-app
    env:
      REPO_REF: ${{ needs.build.outputs[format('{0}_ref', matrix.key)] }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify the resolved ref
        run: |
          if [[ -z "$REPO_REF" ]]; then
            echo "ERROR: no ref resolved for ${{ matrix.key }}"
            exit 1
          fi
          echo "Testing ${{ matrix.repo }} at $REPO_REF"

      - name: Create Temporary Directory to Download Docker Images
        id: tempdir
        run: echo "tmpdir=$(mktemp -d)" >> "$GITHUB_OUTPUT"

      - name: Download Docker Images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e_release_env_images
          path: ${{ steps.tempdir.outputs.tmpdir }}

      - name: Load Docker Images
        run: |
          gzip -d ${{ steps.tempdir.outputs.tmpdir }}/e2e_release_env_images.tar.gz
          docker load --input ${{ steps.tempdir.outputs.tmpdir }}/e2e_release_env_images.tar
          docker image ls -a

      - name: Spin up an OpenMRS Instance
        run: docker compose up -d
        working-directory: ./tests/e2e/

      - name: Checkout to the Repo's Tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openmrs/${{ matrix.repo }}
          ref: ${{ env.REPO_REF }}
          path: e2e_repo

      - name: Copy test environment variables
        run: cp example.env .env
        working-directory: e2e_repo

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: e2e_repo

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: e2e_repo

      - name: Wait for the OpenMRS instance to start
        timeout-minutes: 10
        run: while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/openmrs/login.htm)" != "200" ]]; do sleep 10; done

      - name: Run E2E tests
        run: yarn playwright test
        working-directory: e2e_repo

      - name: Upload Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: e2e_repo/playwright-report/
          retention-days: 30

      - name: Capture Server Logs
        if: failure()
        uses: openmrs/openmrs-contrib-gha-workflows/.github/actions/capture-docker-logs@main
        with:
          dest: "./logs"

      - name: Upload Logs as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-logs-${{ matrix.name }}
          path: "./logs"
          overwrite: true
