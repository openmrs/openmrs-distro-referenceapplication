services:
  monitoring-init:
    image: openmrs/openmrs-reference-application-3-monitoring-init:${TAG:-qa}
    build: ./monitoring
    environment:
      MONITORING_MODE: otlp
      ALLOY_OTLP_ENDPOINT: ${ALLOY_OTLP_ENDPOINT:-}
      ALLOY_OTLP_PROTOCOL: ${ALLOY_OTLP_PROTOCOL:-grpc}
      ALLOY_OTLP_INSECURE: ${ALLOY_OTLP_INSECURE:-false}
    volumes:
      - alloy-config:/etc/alloy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg

  alloy:
    image: grafana/alloy:v1.13.1
    environment:
      ALLOY_OTLP_ENDPOINT: ${ALLOY_OTLP_ENDPOINT:-}
      ALLOY_OTLP_HEADERS: ${ALLOY_OTLP_HEADERS:-}
      ALLOY_OTLP_INSECURE: ${ALLOY_OTLP_INSECURE:-false}
    volumes:
      - alloy-config:/etc/alloy
    # Experimental stability is required for honor_metadata, which preserves
    # Prometheus metric types when converting cAdvisor metrics to OpenTelemetry.
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  backend:
    environment:
      # Attaches the OpenTelemetry Java agent. Nothing is exported without it.
      OMRS_OTEL_ENABLED: "true"

      # Where the agent sends OTLP data. Point this elsewhere if you run your
      # own collector instead of the bundled Alloy.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}

      # Becomes the Prometheus `job` label. Change it if you run more than one
      # backend and need to tell them apart in dashboards.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-openmrs-backend}

      OTEL_METRICS_EXPORTER: otlp
      # Off: Alloy's OTLP receiver only forwards metrics.
      OTEL_TRACES_EXPORTER: none
      # Off: Alloy collects container logs from Docker instead.
      OTEL_LOGS_EXPORTER: none

      # Transport and encoding for OTLP
      # Valid values: http/protobuf, grpc, http/json.
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

      # Extra resource attributes attached to every metric.
      # OTEL_RESOURCE_ATTRIBUTES: service.instance.id=backend-0,deployment.environment.name=prod

      # Collect JMX metrics for a known system, e.g. tomcat.
      # OTEL_JMX_TARGET_SYSTEM: tomcat

volumes:
  alloy-config:
