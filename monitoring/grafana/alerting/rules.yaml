#
# Grafana-managed alert rules (converted from the former Prometheus
# alert.rules.yml). Each rule runs its PromQL as an instant query (A),
# reduces it to a single value (B), then compares it with a threshold
# expression (C) which is the alert condition.
apiVersion: 1

groups:
  - orgId: 1
    name: availability
    folder: OpenMRS Alerts
    interval: 1m
    rules:
      - uid: openmrs-target-down
        title: TargetDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "The target {{ $labels.instance }} (job {{ $labels.job }}) has been unreachable for more than 2 minutes."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: openmrs-endpoint-down
        title: EndpointDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is failing its health probe"
          description: "The blackbox HTTP probe for {{ $labels.instance }} has been failing for more than 2 minutes."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: probe_success
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: openmrs-ssl-cert-expiring-soon
        title: SSLCertExpiringSoon
        condition: C
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires soon"
          description: "The TLS certificate for {{ $labels.instance }} expires in {{ $values.B.Value | humanizeDuration }}."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: probe_ssl_earliest_cert_expiry - time()
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [1209600] # 14 * 24 * 3600 seconds

  - orgId: 1
    name: jvm
    folder: OpenMRS Alerts
    interval: 1m
    rules:
      - uid: openmrs-jvm-heap-high-usage
        title: JvmHeapHighUsage
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenMRS JVM heap usage is high"
          description: "Heap usage has been above 90% of the configured maximum for more than 5 minutes ({{ $values.B.Value | humanizePercentage }})."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                sum by (job) (jvm_memory_used_bytes{job="openmrs-jvm",area="heap"})
                  / sum by (job) (jvm_memory_max_bytes{job="openmrs-jvm",area="heap"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]

      - uid: openmrs-jvm-file-descriptors-high
        title: JvmFileDescriptorsHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenMRS backend is running low on file descriptors"
          description: "Open file descriptors have been above 80% of the limit for more than 5 minutes ({{ $values.B.Value | humanizePercentage }})."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: process_open_fds{job="openmrs-jvm"} / process_max_fds{job="openmrs-jvm"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]

      - uid: openmrs-jvm-backend-restarted
        title: JvmBackendRestarted
        condition: C
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "OpenMRS backend recently restarted"
          description: "The OpenMRS backend JVM has been up for less than 5 minutes; it may have restarted or crashed."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: time() - process_start_time_seconds{job="openmrs-jvm"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [300]

  - orgId: 1
    name: containers
    folder: OpenMRS Alerts
    interval: 1m
    rules:
      - uid: openmrs-container-high-cpu
        title: ContainerHighCpu
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU usage is high"
          description: "Container {{ $labels.name }} has averaged more than 0.9 CPU cores over the last 5 minutes for more than 10 minutes."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]

      - uid: openmrs-container-oom-killed
        title: ContainerOOMKilled
        condition: C
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "Container {{ $labels.name }} experienced an out-of-memory kill event in the last 5 minutes."
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (name) (increase(container_oom_events_total{name!=""}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
