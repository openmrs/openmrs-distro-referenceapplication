apiVersion: 1

# Datasources are recreated on every start. Needed because the uids below were
# pinned after the fact: Grafana cannot change the uid of a datasource it has
# already provisioned, so the old record has to go first.
deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Prometheus
    orgId: 1

datasources:
  - name: Loki
    type: loki
    # Pinned: dashboards reference datasources by uid. Without this Grafana
    # generates one (e.g. PBFA97CFB590B2093) and those references dangle.
    uid: Loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
