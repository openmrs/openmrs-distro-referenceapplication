groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "The target {{ $labels.instance }} (job {{ $labels.job }}) has been unreachable for more than 2 minutes."

      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is failing its health probe"
          description: "The blackbox HTTP probe for {{ $labels.instance }} has been failing for more than 2 minutes."

      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires soon"
          description: "The TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

  - name: jvm
    rules:
      - alert: JvmHeapHighUsage
        expr: |
          sum by (job) (jvm_memory_used_bytes{job="openmrs-jvm",area="heap"})
            / sum by (job) (jvm_memory_max_bytes{job="openmrs-jvm",area="heap"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenMRS JVM heap usage is high"
          description: "Heap usage has been above 90% of the configured maximum for more than 5 minutes ({{ $value | humanizePercentage }})."

      - alert: JvmFileDescriptorsHigh
        expr: process_open_fds{job="openmrs-jvm"} / process_max_fds{job="openmrs-jvm"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenMRS backend is running low on file descriptors"
          description: "Open file descriptors have been above 80% of the limit for more than 5 minutes ({{ $value | humanizePercentage }})."

      - alert: JvmBackendRestarted
        expr: time() - process_start_time_seconds{job="openmrs-jvm"} < 300
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "OpenMRS backend recently restarted"
          description: "The OpenMRS backend JVM has been up for less than 5 minutes; it may have restarted or crashed."

  - name: containers
    rules:
      - alert: ContainerHighCpu
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU usage is high"
          description: "Container {{ $labels.name }} has averaged more than 0.9 CPU cores over the last 5 minutes for more than 10 minutes."

      - alert: ContainerOOMKilled
        expr: sum by (name) (increase(container_oom_events_total{name!=""}[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "Container {{ $labels.name }} experienced an out-of-memory kill event in the last 5 minutes."