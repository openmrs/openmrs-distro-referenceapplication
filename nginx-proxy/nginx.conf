events {}

# Raw TCP passthrough on 80 and 443 straight to the gateway service.
# No TLS termination happens here - the gateway receives the bytes as-is.
#
# proxy_pass to a literal hostname (or a static `upstream {}` block) is
# resolved once at startup and then cached for the life of the process - if
# the gateway container is ever recreated (rebuild, restart, compose up) it
# gets a new IP and this proxy keeps sending traffic to the dead one. Using a
# variable + `resolver` forces re-resolution against Docker's embedded DNS on
# every connection instead.
stream {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    listen [::]:80;
    set $gateway_upstream gateway:80;
    proxy_pass $gateway_upstream;
  }

  server {
    listen 443;
    listen [::]:443;
    set $gateway_upstream gateway:80;
    proxy_pass $gateway_upstream;
  }
}
